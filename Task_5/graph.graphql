type Query {
  client(id: ID!): Client

  # Для обратной совместимости
  clientDocuments(clientId: ID!): [Document!]!
  clientRelatives(clientId: ID!): [Relative!]!
}

type Client {
  id: ID!
  name: String!
  age: Int!

  # Связанные данные - запрашиваются только если явно указаны в запросе
  documents: [Document!]!
  relatives: [Relative!]!
}

type Document {
  id: ID!
  type: String!
  number: String!
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID!
  relationType: String!
  name: String!
  age: Int
}